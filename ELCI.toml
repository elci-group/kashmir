description = "kashmir is a Rust command-line tool that profiles a machine's CPUs, memory, and SIMD features, then turns that profile into short-lived, hardware-fingerprinted execution policies — tuned thread counts and CPU affinity for Rayon or Tokio workloads — which install into a project or wrap a command, expiring instead of going stale."
